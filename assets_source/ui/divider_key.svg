     64px 金色渐变短线。**只允许出现在 Logo 下，全片一条。**
     裁決：identity
     归属：UI 自用
     本文件由 ui_web/tools/emit_svg.mjs 从 ui_web/svg/library.js 生成。
     不要直接改这里 —— 改库，然后重新运行 emitter。
