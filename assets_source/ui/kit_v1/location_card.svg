<svg xmlns="http://www.w3.org/2000/svg" width="640" height="200" viewBox="0 0 640 200">
  <defs>
    <linearGradient id="titleLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A65C" stop-opacity="0"/>
      <stop offset="35%" stop-color="#C9A65C" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#C9A65C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A65C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cardVignette" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0E1418" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0E1418" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft vignette so the name reads over any 3D background -->
  <ellipse cx="320" cy="100" rx="300" ry="86" fill="url(#cardVignette)"/>

  <!-- Chinese, Display 48, serif -->
  <text x="320" y="84" font-family="Noto Serif SC, Source Han Serif SC, serif"
        font-size="48" fill="#EDE4D3" text-anchor="middle">雾谷</text>

  <!-- the single permitted pure decoration: 120px gold gradient rule -->
  <rect x="260" y="104" width="120" height="1" fill="url(#titleLine)"/>

  <!-- English, Small 14, letter-spacing 0.15em -->
  <text x="320" y="146" font-family="Inter, Roboto, sans-serif"
        font-size="14" fill="#B8AE9C" text-anchor="middle"
        letter-spacing="2.1">MISTVALE</text>

  <!-- entry motion reference: fade in 0.4s + 12px rise, hold 2.4s, fade out 0.6s -->
  <text x="320" y="178" font-family="Inter, Roboto, sans-serif"
        font-size="12" fill="#2C3A44" text-anchor="middle"
        letter-spacing="1">IN 0.4s / HOLD 2.4s / OUT 0.6s · UPPER THIRD</text>
</svg>
