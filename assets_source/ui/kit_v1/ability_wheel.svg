<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A65C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A65C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sector fills: unselected -->
  <path d="M 53.5,85.4 A 130 130 0 0 1 266.5,85.4 L 202.6,130.2 A 52 52 0 0 0 117.4,130.2 Z"
        fill="#16202A" stroke="#2C3A44" stroke-width="1"/>
  <path d="M 148.7,289.5 A 130 130 0 0 1 42.2,105.0 L 112.9,138.0 A 52 52 0 0 0 155.5,211.8 Z"
        fill="#16202A" stroke="#2C3A44" stroke-width="1"/>
  <path d="M 277.8,105.0 A 130 130 0 0 1 171.3,289.5 L 164.5,211.8 A 52 52 0 0 0 207.1,138.0 Z"
        fill="#16202A" stroke="#2C3A44" stroke-width="1"/>

  <!-- selected sector = fire (top): gold wash + 2px gold outer edge -->
  <path d="M 53.5,85.4 A 130 130 0 0 1 266.5,85.4 L 202.6,130.2 A 52 52 0 0 0 117.4,130.2 Z"
        fill="#C9A65C" fill-opacity="0.18"/>
  <path d="M 53.5,85.4 A 130 130 0 0 1 266.5,85.4"
        fill="none" stroke="#C9A65C" stroke-width="2"/>

  <!-- outer ring: single 1px Ink Line -->
  <circle cx="160" cy="160" r="150" fill="none" stroke="#2C3A44" stroke-width="1"/>

  <!-- 12px tick marks at sector gaps -->
  <line x1="267.4" y1="98" x2="277.8" y2="92" stroke="#2C3A44" stroke-width="2"/>
  <line x1="160" y1="284" x2="160" y2="296" stroke="#2C3A44" stroke-width="2"/>
  <line x1="52.6" y1="98" x2="42.2" y2="92" stroke="#2C3A44" stroke-width="2"/>

  <!-- ===== element icons, 24px line style ===== -->
  <!-- fire (selected -> Gold Bright stroke) -->
  <g transform="translate(160,69)">
    <path d="M 0,13 C -8,6 -9,-1 -4,-7 C -2,-10 -1,-12 1,-13 C 2,-9 5,-6 6,-3 C 7,0 6,7 0,13 Z"
          fill="none" stroke="#E8CE8C" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- frost -->
  <g transform="translate(81.2,205.5)" stroke="#7FA8C9" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-11" x2="0" y2="11"/>
    <line x1="-9.5" y1="-5.5" x2="9.5" y2="5.5"/>
    <line x1="-9.5" y1="5.5" x2="9.5" y2="-5.5"/>
  </g>
  <!-- wind -->
  <g transform="translate(238.8,205.5)" stroke="#8FBFA6" stroke-width="2"
     stroke-linecap="round" fill="none">
    <path d="M -12,-7 Q -2,-11 10,-6"/>
    <path d="M -14,0 Q 0,-4 13,1"/>
    <path d="M -10,7 Q 0,3 8,7"/>
  </g>

  <!-- ===== centre focus ===== -->
  <circle cx="160" cy="160" r="46" fill="url(#coreGlow)"/>
  <circle cx="160" cy="160" r="32" fill="#0E1418"/>
  <circle cx="160" cy="160" r="32" fill="none" stroke="#C9A65C" stroke-width="1"/>
  <!-- centre glyph: selected skill at 1.15x -->
  <g transform="translate(160,160) scale(1.15)">
    <path d="M 0,9 C -5.5,4 -6,-1 -2.8,-5 C -1.4,-7 -0.7,-8.5 0.7,-9 C 1.4,-6.2 3.5,-4 4.2,-2 C 4.9,0 4.2,4.8 0,9 Z"
          fill="none" stroke="#E8CE8C" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- ===== pointer (aiming up at fire) ===== -->
  <line x1="160" y1="128" x2="160" y2="86" stroke="#C9A65C" stroke-width="2"/>
  <circle cx="160" cy="80" r="3" fill="#C9A65C"/>
</svg>
