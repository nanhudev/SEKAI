; ---------------------------------------------------------------------------
; Driver warning dialog: OFF.
;
; MEASURED, and it cost a full render pass: with a real rasterizer this machine
; reports
;     LogRHI: Warning: Out of date driver found. Using: 'AMD Software:
;             Adrenalin Edition 25.10.30.02' Suggested: '26.2.2'
;     LogRHI: Current driver is denylisted.
; and then BLOCKS on a modal dialog waiting for a click. Non-interactively that
; is infinite: the engine's log stopped at exactly that line, the process sat
; at 748 MB with no main window ever created, and nothing in this project's own
; logs could say why.
;
; The commandlet path never hit it because it already passes -unattended. The
; render path needs a real rasterizer, so it cannot use -nullrhi, and therefore
; it reaches this code. `r.WarnOfBadDrivers` is the documented switch (see
; Engine/Config/BaseHardware.ini).
;
; Set in BOTH sections on purpose. [SystemSettings] is what UE applies for
; renderer settings, but the denylist check runs during RHI init in PreInit -
; earlier than engine init - so the plain CVar table is set too, and whichever
; one is read first wins. The value is 0, not 1: this suppresses the WARNING
; only. The driver really is older than suggested, and the reviews are still
; judged on what the RHI actually produces.
; ---------------------------------------------------------------------------
[SystemSettings]
r.WarnOfBadDrivers=0

[ConsoleVariables]
r.WarnOfBadDrivers=0

