<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>SEKAI mark study 3</title>
    <link rel="stylesheet" href="../tokens/tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--sk-void);
        color: var(--sk-text-2);
        font-family: var(--sk-font-sans);
        padding: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }
      .cell {
        border: 1px solid var(--sk-line-faint);
        background: linear-gradient(180deg, rgba(22, 32, 42, 0.5), rgba(14, 20, 24, 0.15));
        padding: 15px;
      }
      .sizes {
        display: flex;
        align-items: flex-end;
        gap: 22px;
        min-height: 158px;
      }
      .cap {
        font-family: var(--sk-font-num);
        font-size: 12px;
        letter-spacing: 0.22em;
        color: var(--sk-gold);
        text-transform: uppercase;
      }
      .t {
        font-size: 12px;
        color: var(--sk-text-4);
        margin-top: 6px;
        line-height: 1.45;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 11px;
        padding-top: 11px;
        border-top: 1px solid var(--sk-line-faint);
        font-family: var(--sk-font-serif);
        font-size: 20px;
        letter-spacing: 0.42em;
        color: var(--sk-text);
      }
    </style>
  </head>
  <body>
    <div class="grid" id="g"></div>
    <script type="module">
      const A = 'fill="none" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"';
      const P = (r, d) => {
        const a = (d * Math.PI) / 180;
        return [64 + r * Math.cos(a), 64 - r * Math.sin(a)];
      };
      const f = (n) => n.toFixed(2);
      const arc = (r, from, sweep) =>
        `M ${f(P(r, from)[0])} ${f(P(r, from)[1])} A ${r} ${r} 0 ${sweep > 180 ? 1 : 0} 0 ${f(
          P(r, from + sweep)[0]
        )} ${f(P(r, from + sweep)[1])}`;
      const seg = (r0, d0, r1, d1) =>
        `M ${f(P(r0, d0)[0])} ${f(P(r0, d0)[1])} L ${f(P(r1, d1)[0])} ${f(P(r1, d1)[1])}`;
      const dot = (r, d, rad) => `<circle cx="${f(P(r, d)[0])}" cy="${f(P(r, d)[1])}" r="${rad}" fill="var(--sk-gold)"/>`;
      const ring = (r, from, sweep, c, w) =>
        `<circle cx="64" cy="64" r="${r}" fill="none" stroke="${c}" stroke-width="${w}"/>`;

      const CAND = [
        {
          id: 'M1',
          parts: (s) =>
            `<path d="${arc(40, 87, 302)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            dot(0, 0, 5 * s),
          note: '开口环 + 正中一点。信标 / 观察者。极简，任何尺寸都成立。',
        },
        {
          id: 'M2',
          parts: (s) =>
            `<path d="${arc(40, 87, 302)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            dot(15, 58, 5 * s),
          note: '点偏向缺口：正在从开口离开。有一点叙事。',
        },
        {
          id: 'M3',
          parts: (s) =>
            `<path d="${arc(40, 87, 302)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            dot(0, 0, 3.2 * s),
          note: '点更小。最安静。小尺寸会开始丢。',
        },
        {
          id: 'M4',
          parts: (s) =>
            `<path d="${arc(40, 100, 286)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            dot(0, 0, 5 * s),
          note: '缺口更宽（74°）+ 点。开口更明确。',
        },
        {
          id: 'M5',
          parts: (s) =>
            `<path d="${arc(42, 87, 302)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            ring(21, 0, 360, 'var(--sk-gold)', 1.6 * s),
          note: '外环开口 + 内环完整。世界里的世界。',
        },
        {
          id: 'M6',
          parts: (s) =>
            `<path d="${arc(40, 87, 302)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            dot(0, 0, 5 * s) +
            `<path d="${seg(53, 58, 41, 58)}" stroke="var(--sk-gold)" stroke-width="${2 * s}" stroke-linecap="round"/>`,
          note: '环 + 点 + 缺口外一道短笔（合围未成）。信息最多，也最"装置"。',
        },
        {
          id: 'M7',
          parts: (s) =>
            `<path d="${arc(40, 65, 340)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            dot(0, 0, 4.4 * s),
          note: '缺口收窄到 50°，几乎闭合 + 点。读作"就要合上了"。',
        },
        {
          id: 'M8',
          parts: (s) =>
            `<path d="${arc(40, 87, 302)}" stroke="var(--sk-text)" stroke-width="${2.2 * s}"/>` +
            `<path d="${seg(0, 0, 0, 0)}" stroke="none"/>` +
            `<circle cx="64" cy="64" r="${4.6 * s}" fill="none" stroke="var(--sk-gold)" stroke-width="${2 * s}"/>`,
          note: '中心是一个空心小环而不是实点。像轴 / 像瞳孔。',
        },
      ];

      const render = (c, size, sw) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 128 128" ${A}>${c.parts(size / 128)}</svg>`;

      document.getElementById('g').innerHTML = CAND.map(
        (c) => `
        <div class="cell">
          <div class="sizes">
            ${render(c, 138, 0)}
            ${render(c, 52, 0)}
            ${render(c, 26, 0)}
            ${render(c, 16, 0)}
          </div>
          <div class="cap">${c.id}</div>
          <div class="t">${c.note}</div>
          <div class="inline">${render(c, 24, 0)} SEKAI</div>
        </div>`
      ).join('');

      document.documentElement.dataset.ready = '1';
    </script>
  </body>
</html>
