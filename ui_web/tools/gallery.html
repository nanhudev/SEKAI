<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SEKAI · SVG COMPONENT GALLERY</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  /* 这不是一个页面，是一张**样张**（§K）。
     它读的是 assets_source/ui/*.svg —— 也就是 emit_svg.mjs 真正落盘的文件，
     不是库里的字符串。两者长得一样，才说明"网页里的图标和 Godot 里的图标是同一个"。 */
  html, body { margin: 0; background: var(--sk-void); color: var(--sk-text); }
  body { font-family: var(--sk-font-sans); padding: 40px 48px 72px; }
  h1 { font-family: var(--sk-font-serif); font-size: 20px; font-weight: 400;
       letter-spacing: var(--sk-track-title); margin: 0 0 4px; }
  .sub { font-size: 11px; letter-spacing: var(--sk-track-wide);
         color: var(--sk-text-3); text-transform: uppercase; margin-bottom: 40px; }
  h2 { font-size: 12px; font-weight: 500; letter-spacing: var(--sk-track-wide);
       color: var(--sk-text-3); text-transform: uppercase;
       margin: 40px 0 14px; padding-bottom: 8px;
       border-bottom: 1px solid var(--sk-line-faint); }
  .row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .cell .lv { display: block; margin-top: 8px; font-size: 10px;
              letter-spacing: 0.16em; color: var(--sk-text-4); }
  /* 这些线的原生高度是 1–6px。按原生高度放进来，在一张 1400 宽的样张
     上会被缩图吃掉，评审根本看不到 —— 所以给一个可看的高度。
     着色器里的线宽是 non-scaling-stroke，拉高不会把线拉粗。

     **必须同时给宽度上限。** divider_hair 原生 400×1，只写 height:16px
     会算出 6400px 宽 —— 一行线直接冲出 1304px 的内容区，把版式撑破，
     还让整页多出横向滚动。统一给 340×16 的框，四条线还能横向对比。 */
  .cell--line { width: 340px; }
  .cell--line img { width: 100%; height: 16px; }
  .board { display: flex; gap: 20px; align-items: center; }
  .board img { display: block; }
  .onlight { background: #EDE4D3; padding: 14px; }
  .panel { position: relative; border: 0; width: 320px; height: 200px; }
  .panel img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .note { font-size: 11px; line-height: 1.7; color: var(--sk-text-3);
          max-width: 640px; margin-top: 10px; }
  .meta { font-size: 10px; letter-spacing: 0.14em; color: var(--sk-text-4);
          text-transform: uppercase; margin-top: 6px; }
</style>
</head>
<body>
  <h1>SEKAI · 动态 SVG 组件</h1>
  <div class="sub">assets_source/ui · generated by tools/emit_svg.mjs</div>
  <div id="root"></div>

<script type="module">
const DIR = '/assets_source/ui/';

const text = async (name) => {
  const r = await fetch(DIR + name + '.svg');
  if (!r.ok) throw new Error(`${name}: ${r.status}`);
  return r.text();
};

/* PASS 03 裁決掉的两件已停止落盘（emit_svg 会把残留文件删掉）。
   但样张必须**继续显示它们** —— 一张看不见"被删掉的是什么"的审查表，
   下次会有人重新把它画回来。所以这两件从库内联渲染，不走磁盘。 */
import { ringArc, cornerFrame } from '../svg/library.js';

/** 把落盘文件的尺寸改掉，用于看它在不同尺寸下是否还成立 */
const at = (svg, size, attr = 'width') =>
  svg.replace(/width="\d+(\.\d+)?"/, `${attr}="${size}"`);

const root = document.getElementById('root');
function section(title, extra = '') {
  const h = document.createElement('h2');
  h.textContent = title;
  root.appendChild(h);
  if (extra) {
    const p = document.createElement('div');
    p.className = 'note';
    p.textContent = extra;
    root.appendChild(p);
  }
  const row = document.createElement('div');
  row.className = 'row';
  root.appendChild(row);
  return row;
}
function cell(host, html, label, cls = '') {
  const d = document.createElement('div');
  d.className = 'cell' + (cls ? ' ' + cls : '');
  d.innerHTML = html + `<span class="lv">${label}</span>`;
  host.appendChild(d);
  return d;
}

const mark = await text('sekai_mark');
const arc = await text('sekai_mark_arc_only');

/* 1. 标记在四个尺寸下 —— 小尺寸不糊，是它能当 logo 的前提 */
{
  const row = section('1 · 标记 · 尺寸阶梯',
    '"开口的环 + 正中一点"。16px 时环仍读得出缺口（缺口角度 58°，落在右上），这是 M1 方案胜出的原因。');
  for (const s of [140, 64, 32, 16]) {
    cell(row, at(mark, s), `${s}px`);
  }
  cell(row, `<div class="board">${at(mark, 48)}${at(arc, 48)}</div>`, '完整 / 无点');
}

/* 2. 背景环 —— PASS 03 已裁決 DEMOTE，不再落盘。
      这里从库**内联**渲染，只为保留历史对照：让人看清"那个巨大的装饰圆环"
      具体长什么样，免得下一个人又把它捡回来。 */
{
  const row = section('2 · 世界的环 —— ⛔ DEMOTE（PASS 03）',
    '与标记同源：同一个缺口角度、同一段弧。但它不表达任何状态 —— 放在背景里只是"看起来很 SEKAI"，正是 DE-AI 清单第 3 条。V2 全线禁用，emit_svg 已停止导出。此格仅为历史对照，不从磁盘加载。');
  const box = document.createElement('div');
  box.className = 'board';
  box.style.cssText = 'width:520px;height:260px;overflow:hidden;position:relative;border:1px solid var(--sk-line-faint);opacity:.45;filter:grayscale(1)';
  box.innerHTML = at(ringArc({ size: 800, r: 392, from: 87, to: 389, stroke: 1 }), '800')
    .replace('<svg ', '<svg style="position:absolute;left:60px;top:-380px" ');
  row.appendChild(box);
}

/* 3. 线：焦点线 / 分隔线 / 地点装饰 */
{
  const row = section('3 · 线',
    '三条都是渐变描边。它们曾经整条不画 —— 水平线的 bbox 高度为 0，默认 objectBoundingBox 的渐变会退化，而规格规定退化渐变不渲染。已改为 userSpaceOnUse。落盘文件里的颜色也必须解析成字面值：Godot（ThorVG）不认 CSS 变量。');
  cell(row, `<img src="${DIR}focus_line.svg">`, 'focus_line · 400×6', 'cell--line');
  cell(row, `<img src="${DIR}divider_key.svg">`, 'divider · key', 'cell--line');
  cell(row, `<img src="${DIR}divider_hair.svg">`, 'divider · hair', 'cell--line');
  cell(row, `<img src="${DIR}location_ornament.svg">`, 'location_ornament', 'cell--line');
}

/* 4. 结构件 */
{
  const row = section('4 · 结构件',
    'corner_frame ⛔ DELETE（PASS 03）：它是装饰边框的第一块砖，且不表达状态 —— 内容怎么变，角都不变。此格仅历史对照，已从导出移除、不从磁盘加载。');
  const p = document.createElement('div');
  p.className = 'panel';
  p.style.cssText = 'border:1px solid var(--sk-line-faint);opacity:.45;filter:grayscale(1)';
  p.innerHTML = cornerFrame({ w: 320, h: 200, arm: 18, stroke: 1 })
    .replace('<svg ', '<svg style="width:100%;height:100%" ');
  row.appendChild(p);
  cell(row, `<img src="${DIR}loading_ring.svg" style="width:96px">`, 'loading_ring');
  cell(row, `<img src="${DIR}ability_segment.svg" style="width:130px">`, 'ability_segment');
}

/* 5. 浅底检查：不能只有深底能看 */
{
  const row = section('5 · 浅底检查',
    '标记的环是象牙白 —— 在白底上本来就看不见。所以这一格把整块**压暗**，'
    + '只为检查几何形态（缺口、角、弧）本身不依赖底色：形状对了，颜色换一种就成立。'
    + '正式产品不出现浅色 UI。');
  const box = document.createElement('div');
  box.className = 'onlight';
  // brightness(0.14) 把象牙白压成近黑，让弧线在浅底上重新可读。
  box.innerHTML =
    `<div class="board" style="filter:brightness(0.14)">${at(mark, 64)}${at(mark, 32)}</div>`;
  row.appendChild(box);
}
document.documentElement.dataset.ready = '1';
</script>
</body>
</html>
