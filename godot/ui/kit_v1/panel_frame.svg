<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1418" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#16202A" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="scanline" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE4D3" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#EDE4D3" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="url(#scanline)"/>
    </pattern>
  </defs>

  <!-- 9-slice panel body: 24px slice margins, 8px corner chamfer -->
  <path d="M 8,0 H 472 L 480,8 V 312 L 472,320 H 8 L 0,312 V 8 Z"
        fill="url(#panelBg)"/>
  <path d="M 8,0 H 472 L 480,8 V 312 L 472,320 H 8 L 0,312 V 8 Z"
        fill="url(#scan)" opacity="0.5"/>
  <!-- 1px Ink Line inner border -->
  <path d="M 8,0 H 472 L 480,8 V 312 L 472,320 H 8 L 0,312 V 8 Z"
        fill="none" stroke="#2C3A44" stroke-width="1"/>
  <!-- 1px gold outer hairline, inset 2 -->
  <path d="M 9,2 H 470 L 478,10 V 310 L 470,318 H 10 L 2,310 V 10 Z"
        fill="none" stroke="#C9A65C" stroke-opacity="0.25" stroke-width="1"/>

  <!-- title bar 56px + divider -->
  <line x1="1" y1="56" x2="479" y2="56" stroke="#2C3A44" stroke-width="1"/>
  <text x="24" y="36" font-family="Noto Serif SC, Source Han Serif SC, serif"
        font-size="24" fill="#EDE4D3" dominant-baseline="middle">面板标题</text>
  <text x="456" y="36" font-family="Inter, Roboto, sans-serif"
        font-size="12" fill="#B8AE9C" text-anchor="end" dominant-baseline="middle">PANEL FRAME</text>

  <!-- body sample content -->
  <line x1="24" y1="112" x2="120" y2="112" stroke="#2C3A44" stroke-width="1"/>
  <text x="24" y="146" font-family="Inter, Roboto, sans-serif"
        font-size="18" fill="#EDE4D3" dominant-baseline="middle">设置</text>
  <text x="456" y="146" font-family="Inter, Roboto, sans-serif"
        font-size="14" fill="#B8AE9C" text-anchor="end" dominant-baseline="middle">SETTINGS</text>

  <text x="24" y="188" font-family="Inter, Roboto, sans-serif"
        font-size="18" fill="#EDE4D3" dominant-baseline="middle">画面</text>
  <text x="456" y="188" font-family="Inter, Roboto, sans-serif"
        font-size="14" fill="#B8AE9C" text-anchor="end" dominant-baseline="middle">DISPLAY</text>

  <text x="24" y="230" font-family="Inter, Roboto, sans-serif"
        font-size="18" fill="#B8AE9C" dominant-baseline="middle">音频</text>
  <text x="456" y="230" font-family="Inter, Roboto, sans-serif"
        font-size="14" fill="#B8AE9C" text-anchor="end" dominant-baseline="middle">AUDIO</text>

  <!-- short gold divider as focus marker -->
  <defs>
    <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A65C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A65C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="24" y="164" width="64" height="1" fill="url(#goldFade)"/>
</svg>
